name: Telegram Bot 24x7
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -U -r requirements.txt

      - name: Configure git for background sync
        run: |
          git config user.name "studio-bot"
          git config user.email "bot@users.noreply.github.com"

      # Instagram login session restart ke baad bhi yaad rahe (repo me commit nahi hota)
      - name: Restore Instagram session
        uses: actions/cache/restore@v4
        with:
          path: config/ig_session.json
          key: ig-session-${{ github.run_id }}
          restore-keys: ig-session-

      - name: Run bot for 5h50m
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_TOTP_SECRET: ${{ secrets.IG_TOTP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 21000 python src/telegram_bot.py || true

      - name: Save Instagram session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: config/ig_session.json
          key: ig-session-${{ github.run_id }}

      - name: Restart myself (no gap)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run bot.yml || true
