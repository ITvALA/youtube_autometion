name: Hour Loop (6 Videos Daily)
on:
  workflow_dispatch:
  schedule:
    - cron: "5 */6 * * *"

concurrency:
  group: four-hour-loop
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Trigger daily.yml every 4 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          if git cat-file -e origin/main:LOOP_OFF 2>/dev/null; then
            echo "LOOP_OFF file mili. Loop band."
            exit 0
          fi

          echo "daily.yml trigger at $(date -u)"
          gh workflow run daily.yml --ref main -f mode=myth

          sleep 14400

          git fetch -q origin main
          if git cat-file -e origin/main:LOOP_OFF 2>/dev/null; then
            echo "LOOP_OFF file mili. Dobara shuru nahi karenge."
            exit 0
          fi

          echo "4 ghante poore. Loop ko dobara shuru kar raha hoon."
          gh workflow run hourly-loop.yml --ref main
