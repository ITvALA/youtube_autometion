name: Harvest Myth & Folklore Topics
on:
  schedule:
    - cron: "0 3 * * 0"   # Every Sunday at 03:00 UTC (8:30 AM IST)
  workflow_dispatch:      # Manual trigger button anytime
    inputs:
      count:
        description: "Number of new topics to harvest"
        type: string
        default: "1"
      source:
        description: "Source to query (all, wikipedia, reddit, local)"
        type: choice
        options:
          - all
          - wikipedia
          - reddit
          - local
        default: all

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Topic Harvester
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT="${{ inputs.count }}"
          SOURCE="${{ inputs.source }}"
          [ -z "$COUNT" ] && COUNT=1
          [ -z "$SOURCE" ] && SOURCE="all"
          echo "🚀 Harvesting $COUNT new topic(s) from $SOURCE..."
          python scripts/harvest_myth_topics.py --count "$COUNT" --source "$SOURCE"

      - name: Commit and Push New Topics
        run: |
          if git status --porcelain data/myth_topics_extra.json | grep -q "data/myth_topics_extra.json"; then
            echo "📦 New topic(s) discovered! Committing to repository..."
            git config --global user.name "MindSpark Harvester Bot"
            git config --global user.email "bot@mindspark.local"
            git add data/myth_topics_extra.json
            git commit -m "chore(myth): harvest fresh folklore and local deity topics"
            git pull --rebase origin main
            git push origin main
            echo "✅ Successfully pushed updated topics to GitHub!"
          else
            echo "ℹ️ No new topics needed or all candidates already exist in database."
          fi

